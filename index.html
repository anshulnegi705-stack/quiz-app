<!DOCTYPE html>
<html>
<head>
<title>Ultimate Quiz App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.container{
  width:90%;
  max-width:700px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.3);
}

h1{
  text-align:center;
}

#question{
  font-size:20px;
  margin:20px 0;
}

.option{
  background:rgba(255,255,255,0.2);
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.option:hover{
  background:rgba(255,255,255,0.35);
}

.correct{
  background:#28a745 !important;
}

.wrong{
  background:#dc3545 !important;
}

.info{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:bold;
}

.timer{
  color:#ffd700;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#00c6ff;
  color:black;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#0072ff;
  color:white;
}

.hidden{
  display:none;
}

.result{
  text-align:center;
}

</style>
</head>
<body>

<div class="container">

<h1>🚀 Ultimate Quiz App</h1>

<div id="quizBox">

<div class="info">
<span>Score: <span id="score">0</span></span>
<span>Question: <span id="qNumber">1</span>/10</span>
<span class="timer">Time: <span id="time">15</span>s</span>
</div>

<div id="question"></div>
<div id="options"></div>

</div>

<div id="resultBox" class="hidden result">
<h2>Quiz Completed 🎉</h2>
<p>Your Score: <span id="finalScore"></span></p>
<p>Percentage: <span id="percentage"></span>%</p>
<button onclick="restartQuiz()">Restart Quiz</button>
</div>

</div>

<script>

const questions = [
{
question:"What does HTML stand for?",
options:["Hyper Text Markup Language","Home Tool Markup Language","Hyperlinks Text Mark Language","Hyper Tool Multi Language"],
answer:0
},
{
question:"Which planet is known as the Red Planet?",
options:["Earth","Mars","Jupiter","Venus"],
answer:1
},
{
question:"What is 5 + 7?",
options:["10","11","12","13"],
answer:2
},
{
question:"Who wrote 'Romeo and Juliet'?",
options:["Charles Dickens","William Shakespeare","Mark Twain","Leo Tolstoy"],
answer:1
},
{
question:"Which gas do plants absorb?",
options:["Oxygen","Nitrogen","Carbon Dioxide","Hydrogen"],
answer:2
},
{
question:"Which language is used for styling web pages?",
options:["HTML","JQuery","CSS","XML"],
answer:2
},
{
question:"Which is the largest ocean?",
options:["Indian","Pacific","Atlantic","Arctic"],
answer:1
},
{
question:"What is the capital of France?",
options:["Berlin","Madrid","Paris","Rome"],
answer:2
},
{
question:"What does CPU stand for?",
options:["Central Processing Unit","Computer Personal Unit","Central Power Unit","Control Processing Unit"],
answer:0
},
{
question:"Which year did World War II end?",
options:["1945","1939","1918","1965"],
answer:0
}
];

let currentQuestion=0;
let score=0;
let timer;
let timeLeft=15;

function startQuiz(){
  currentQuestion=0;
  score=0;
  document.getElementById("score").innerText=score;
  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  resetTimer();
  timeLeft=15;
  document.getElementById("time").innerText=timeLeft;

  let q=questions[currentQuestion];
  document.getElementById("question").innerText=q.question;
  document.getElementById("qNumber").innerText=currentQuestion+1;

  let optionsBox=document.getElementById("options");
  optionsBox.innerHTML="";

  q.options.forEach((option,index)=>{
    let div=document.createElement("div");
    div.classList.add("option");
    div.innerText=option;
    div.onclick=()=>selectAnswer(div,index);
    optionsBox.appendChild(div);
  });

  startTimer();
}

function selectAnswer(element,index){
  resetTimer();
  let correctIndex=questions[currentQuestion].answer;
  let options=document.querySelectorAll(".option");

  options.forEach((opt,i)=>{
    if(i===correctIndex){
      opt.classList.add("correct");
    }
  });

  if(index===correctIndex){
    score++;
    document.getElementById("score").innerText=score;
  }else{
    element.classList.add("wrong");
  }

  setTimeout(()=>{
    currentQuestion++;
    if(currentQuestion<questions.length){
      showQuestion();
    }else{
      endQuiz();
    }
  },1000);
}

function startTimer(){
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById("time").innerText=timeLeft;

    if(timeLeft<=0){
      resetTimer();
      currentQuestion++;
      if(currentQuestion<questions.length){
        showQuestion();
      }else{
        endQuiz();
      }
    }
  },1000);
}

function resetTimer(){
  clearInterval(timer);
}

function endQuiz(){
  document.getElementById("quizBox").classList.add("hidden");
  document.getElementById("resultBox").classList.remove("hidden");

  document.getElementById("finalScore").innerText=score+" / "+questions.length;
  let percent=Math.round((score/questions.length)*100);
  document.getElementById("percentage").innerText=percent;
}

function restartQuiz(){
  startQuiz();
}

startQuiz();

</script>

</body>
</html>

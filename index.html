<!DOCTYPE html>
<html>
<head>
<title>Ultimate Pro Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:white;
  overflow-x:hidden;
}

/* Animated background */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle,#00c6ff33,#0072ff11,#000000);
  animation:moveBg 20s linear infinite;
}
@keyframes moveBg{
  0%{transform:translate(0,0);}
  50%{transform:translate(-200px,-200px);}
  100%{transform:translate(0,0);}
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px;
}

.hidden{ display:none; }

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
  margin-top:20px;
  animation:fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

h1,h2{ text-align:center; }

button{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  margin:8px;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#00c6ff,#0072ff);
  color:white;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px #00c6ff;
}

.option{
  background:rgba(255,255,255,0.15);
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}
.option:hover{
  background:rgba(255,255,255,0.3);
}

.correct{ background:#28a745 !important; }
.wrong{ background:#dc3545 !important; }

.top-bar{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:15px;
}

.timer{ color:#ffd700; }

select{
  padding:10px;
  border-radius:10px;
  border:none;
  width:100%;
  margin:10px 0;
}

.history-item{
  background:rgba(255,255,255,0.1);
  padding:10px;
  margin:8px 0;
  border-radius:10px;
}

</style>
</head>
<body>

<div class="container">

<!-- HOME PAGE -->
<div id="home" class="card">
<h1>🚀 Ultimate Pro Quiz</h1>
<p style="text-align:center;">Challenge yourself with beautiful interactive quizzes!</p>
<div style="text-align:center;">
<button onclick="goToCategories()">Start Quiz</button>
<button onclick="openAdmin()">Admin Panel</button>
</div>
</div>

<!-- CATEGORY PAGE -->
<div id="categories" class="card hidden">
<h2>Select Category</h2>
<select id="categorySelect">
<option>Programming</option>
<option>Science</option>
<option>History</option>
<option>Math</option>
<option>General Knowledge</option>
</select>
<div style="text-align:center;">
<button onclick="startQuiz()">Begin</button>
<button onclick="goHome()">Back</button>
</div>
</div>

<!-- QUIZ PAGE -->
<div id="quizPage" class="card hidden">
<div class="top-bar">
<span>Score: <span id="score">0</span></span>
<span>Q: <span id="qNumber">1</span>/15</span>
<span class="timer">Time: <span id="time">15</span>s</span>
</div>

<h3 id="question"></h3>
<div id="options"></div>

<div style="text-align:center;">
<button onclick="nextQuestion()">Next</button>
<button onclick="pauseQuiz()">Pause</button>
<button onclick="resumeQuiz()">Resume</button>
<button onclick="endQuiz()">Stop & See Score</button>
</div>
</div>

<!-- RESULT PAGE -->
<div id="resultPage" class="card hidden">
<h2>Quiz Completed 🎉</h2>
<p>Your Score: <span id="finalScore"></span></p>
<p>Percentage: <span id="percentage"></span>%</p>
<div style="text-align:center;">
<button onclick="goHome()">Home</button>
</div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPage" class="card hidden">
<h2>Admin Panel - Quiz History</h2>
<div id="history"></div>
<div style="text-align:center;">
<button onclick="goHome()">Back</button>
</div>
</div>

</div>

<script>

let questions=[];
let currentIndex=0;
let score=0;
let timer;
let timeLeft=15;
let paused=false;
let selectedAnswer=null;

function generateQuestions(category){
  questions=[];
  for(let i=1;i<=15;i++){
    questions.push({
      question:`(${category}) Question ${i}: What is ${i} + ${i}?`,
      options:[i+i, i+i+1, i+i-1, i+i+2],
      answer:0
    });
  }
}

function goToCategories(){
  home.classList.add("hidden");
  categories.classList.remove("hidden");
}

function goHome(){
  home.classList.remove("hidden");
  categories.classList.add("hidden");
  quizPage.classList.add("hidden");
  resultPage.classList.add("hidden");
  adminPage.classList.add("hidden");
}

function startQuiz(){
  let category=categorySelect.value;
  generateQuestions(category);
  categories.classList.add("hidden");
  quizPage.classList.remove("hidden");
  currentIndex=0;
  score=0;
  showQuestion();
}

function showQuestion(){
  resetTimer();
  timeLeft=15;
  time.innerText=timeLeft;
  selectedAnswer=null;

  let q=questions[currentIndex];
  question.innerText=q.question;
  qNumber.innerText=currentIndex+1;
  document.getElementById("score").innerText=score;

  options.innerHTML="";
  q.options.forEach((opt,index)=>{
    let div=document.createElement("div");
    div.classList.add("option");
    div.innerText=opt;
    div.onclick=()=>selectAnswer(div,index);
    options.appendChild(div);
  });

  startTimer();
}

function selectAnswer(element,index){
  if(selectedAnswer!==null) return;
  selectedAnswer=index;

  let correctIndex=questions[currentIndex].answer;
  let allOptions=document.querySelectorAll(".option");

  allOptions[correctIndex].classList.add("correct");
  if(index!==correctIndex){
    element.classList.add("wrong");
  }else{
    score++;
  }
}

function nextQuestion(){
  if(currentIndex<questions.length-1){
    currentIndex++;
    showQuestion();
  }else{
    endQuiz();
  }
}

function startTimer(){
  timer=setInterval(()=>{
    if(!paused){
      timeLeft--;
      time.innerText=timeLeft;
      if(timeLeft<=0){
        nextQuestion();
      }
    }
  },1000);
}

function resetTimer(){
  clearInterval(timer);
}

function pauseQuiz(){
  paused=true;
}

function resumeQuiz(){
  paused=false;
}

function endQuiz(){
  resetTimer();
  quizPage.classList.add("hidden");
  resultPage.classList.remove("hidden");

  finalScore.innerText=score+" / 15";
  let percent=Math.round((score/15)*100);
  percentage.innerText=percent;

  saveHistory(percent);
}

function saveHistory(percent){
  let history=JSON.parse(localStorage.getItem("quizHistory"))||[];
  history.push({
    date:new Date().toLocaleString(),
    score:score,
    percent:percent
  });
  localStorage.setItem("quizHistory",JSON.stringify(history));
}

function openAdmin(){
  home.classList.add("hidden");
  adminPage.classList.remove("hidden");
  loadHistory();
}

function loadHistory(){
  let history=JSON.parse(localStorage.getItem("quizHistory"))||[];
  historyDiv=document.getElementById("history");
  historyDiv.innerHTML="";
  history.forEach(item=>{
    let div=document.createElement("div");
    div.classList.add("history-item");
    div.innerText=`${item.date} | Score: ${item.score}/15 | ${item.percent}%`;
    historyDiv.appendChild(div);
  });
}

</script>

</body>
</html>
